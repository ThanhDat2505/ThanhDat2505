name: Metrics

on:
  # Chạy tự động mỗi ngày lúc 07:00 giờ Việt Nam (00:00 UTC)
  schedule:
    - cron: "0 0 * * *"
  # Cho phép bấm chạy tay từ tab Actions
  workflow_dispatch:

  # LƯU Ý: đã BỎ trigger `push`.
  # Workflow này tự commit file SVG vào main. Nếu commit đó được tạo bằng PAT,
  # nó sẽ kích hoạt lại chính workflow này -> 2 run chạy song song cùng ghi vào
  # main -> lỗi "does not match <sha>" khi commit.

# Chỉ cho phép 1 run tại một thời điểm. Nếu bấm Run workflow trong lúc run cũ
# chưa xong, run cũ sẽ bị huỷ thay vì chạy song song.
concurrency:
  group: metrics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------------
      # 1. Ảnh tổng quan chính: header, activity, community, repositories
      # ------------------------------------------------------------------
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ThanhDat2505
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Ho_Chi_Minh
          retries_output_action: 10
          retries_delay_output_action: 90
          config_display: large
          repositories_affiliations: owner, collaborator

      # ------------------------------------------------------------------
      # 2. Ngôn ngữ sử dụng nhiều nhất (phân tích sâu theo dòng code thật)
      # ------------------------------------------------------------------
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ThanhDat2505
          filename: metrics.plugin.languages.indepth.svg
          base: ""
          config_timezone: Asia/Ho_Chi_Minh
          retries_output_action: 10
          retries_delay_output_action: 90
          plugin_languages: yes
          plugin_languages_analysis_timeout: 8
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 200
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage

      # ------------------------------------------------------------------
      # 3. Lịch commit dạng vòng tròn cả năm
      # ------------------------------------------------------------------
      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ThanhDat2505
          filename: metrics.plugin.isocalendar.fullyear.svg
          base: ""
          config_timezone: Asia/Ho_Chi_Minh
          retries_output_action: 10
          retries_delay_output_action: 90
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ------------------------------------------------------------------
      # ĐÃ GỠ BỎ 2 PLUGIN (không sửa được bằng cấu hình):
      #
      # - achievements : query field `user.projects` (Projects classic) mà
      #                  GitHub đã khai tử -> GraphQL trả `user: null`.
      # - habits       : luôn báo "Unexpected error". Plugin này phụ thuộc
      #                  Events API và docker image v3.34 build từ 09/2023
      #                  nên đã lệch so với GitHub API hiện tại.
      #
      # Nếu sau này muốn thử lại, thêm `debug: yes` vào step để xem lỗi thật.
      # ------------------------------------------------------------------
